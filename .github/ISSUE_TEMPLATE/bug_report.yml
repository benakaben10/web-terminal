name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: image
    attributes:
      label: Image tag or commit
      placeholder: benakaben24/web-terminal:latest, or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options: [linux/amd64, linux/arm64]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Device and browser
      description: Matters for anything touching gestures, the soft keyboard or IME.
      placeholder: Pixel 8 / Chrome 140, iPhone 15 / Safari 18, desktop Firefox
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail=50`, and the browser console if the problem is in the UI."
      render: text
