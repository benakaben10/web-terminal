name: docker

# Publishes to Docker Hub, 64-bit only: linux/amd64 for Ubuntu servers and
# linux/arm64 for Apple Silicon. Nothing 32-bit is built — the Dockerfile
# rejects any other TARGETARCH outright rather than downloading the wrong
# binaries.
#
# Each architecture is a build of its own, on a runner of that architecture,
# and pushes tags carrying its own prefix:
#
#     benakaben24/web-terminal:amd64-latest
#     benakaben24/web-terminal:arm64-latest
#
# A final job points the unprefixed tags (latest, master, sha-…) at a manifest
# list made of those two, so `docker pull` without a prefix still resolves to
# the right architecture on its own.
#
# QEMU would save the second runner, but this image compiles node-pty and
# unpacks a couple of gigabytes of tooling, and emulating that turns a few
# minutes into the better part of an hour.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # The Docker Hub namespace is not necessarily the login name, so it is spelled
  # out rather than derived from the DOCKER_HUB_USERNAME secret.
  REGISTRY: docker.io
  IMAGE_NAME: benakaben24/web-terminal

jobs:
  build:
    name: build ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    # Where DOCKER_HUB_USERNAME and DOCKER_HUB_PAT live. Without this the job is
    # handed empty strings and the registry login fails. Skipped for pull
    # requests, which push nothing and would otherwise queue behind any
    # protection rules on the environment.
    environment: ${{ github.event_name == 'pull_request' && '' || 'prod' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # Free on public repositories only. On a private repo either enable
          # the paid larger runners or build this one through QEMU instead.
          - slug: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # onlatest applies the prefix to "latest" as well, so this job can
          # never publish an unprefixed tag that the other job would overwrite.
          flavor: |
            latest=auto
            prefix=${{ matrix.slug }}-,onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # A pull request only has to prove the Dockerfile still builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,scope=${{ matrix.slug }},mode=min

  manifest:
    name: publish manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Same environment secrets: this job logs in twice, to push the manifest
    # list and to update the Docker Hub description.
    environment: prod
    permissions:
      contents: read

    steps:
      # Needed for the Docker Hub description sync, which reads README.md.
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Combine the two architecture tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eux
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${IMAGE}:amd64-${VERSION}" \
            "${IMAGE}:arm64-${VERSION}"

      - name: Inspect manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Sync the README to Docker Hub
        # Only from the default branch: a tag build republishes an older README
        # otherwise. Failure here must not fail a release that already shipped.
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PAT }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: >-
            Mobile-first web terminal - a lightweight bastion with zsh and a full DevOps toolchain
          readme-filepath: ./README.md

      - name: Smoke test amd64
        # Native to this runner, so it exercises that half for real: the server
        # has to answer /healthz and the toolchain has to actually run.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eux
          docker run -d --name wt-smoke -e WT_PASSWORD=ci-smoke-test \
            -p 7681:7681 "${IMAGE}:amd64-${VERSION}"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7681/healthz >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:7681/healthz
          docker exec wt-smoke bash -lc '
            uname -m
            terraform version >/dev/null &&
            kubectl version --client >/dev/null &&
            helm version --short >/dev/null &&
            aws --version &&
            k9s version --short >/dev/null &&
            go version'
          docker rm -f wt-smoke
