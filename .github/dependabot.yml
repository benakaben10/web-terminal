version: 2
updates:
  # The pinned tool versions in the Dockerfile are plain build args and are not
  # visible to Dependabot; they are bumped by hand. These three ecosystems are.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
